<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leistungsspange Lernhub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#111213;--surface:#1a1c1e;--border:#2e3133;--text:#dfe1db;--muted:#6b7175;--red:#cc2b2b;}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
::selection{background:var(--red);color:#fff;}
.hub{max-width:400px;width:100%;}
.hub-header{margin-bottom:32px;}
.hub-header h1{font-size:26px;font-weight:700;color:#fff;margin:0;letter-spacing:-0.3px;}
.tool-list{display:flex;flex-direction:column;gap:2px;}
a.tool-link{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent;text-decoration:none;color:var(--text);transition:border-color .12s,background .12s;}
a.tool-link:hover{border-left-color:var(--red);background:#1f2123;}
a.tool-link:hover .tool-arrow{transform:translateX(3px);color:#fff;}
.tool-name{font-size:15px;font-weight:600;color:#fff;}
.tool-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.tool-arrow{color:var(--muted);font-size:16px;flex-shrink:0;margin-left:12px;transition:transform .12s,color .12s;}
</style>
</head>
<body>
<div class="hub">
  <div class="hub-header">
    <h1>Leistungsspange Lernhub</h1>
  </div>
  <div class="tool-list">
    <a class="tool-link" href="./gruppenfuehrer-befehle/">
      <div>
        <div class="tool-name">Gruppenführer-Befehle</div>
        <div class="tool-desc">Marsch, Meldung &amp; Löschangriff-Befehlsgebung</div>
      </div>
      <span class="tool-arrow">→</span>
    </a>
    <a class="tool-link" href="./leistungsspange-fragen/">
      <div>
        <div class="tool-name">Fragenbeantwortung</div>
        <div class="tool-desc">Alle Fragen der Broschüre als Karteikarten</div>
      </div>
      <span class="tool-arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>

  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 90px;}

  header{border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:22px;text-align:center;}

  .title span{color:var(--clay-bright);}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:1.5px;margin-top:6px;}

  .cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
  .cat-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    background:transparent;border:1.5px solid var(--steel);color:var(--chalk);padding:8px 13px;cursor:pointer;
  }
  .cat-btn.active{background:var(--clay);border-color:var(--clay);}
  .cat-btn:hover:not(.active){border-color:var(--clay-bright);color:var(--clay-bright);}

  .statbar{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);margin-bottom:10px;padding:0 2px;}
  .statbar b{color:var(--ok-bright);}

  .card{
    border:1px solid var(--line);background:var(--iron-2);min-height:230px;
    display:flex;flex-direction:column;justify-content:center;padding:26px 24px;
    cursor:pointer;user-select:none;margin-bottom:16px;transition:border-color .15s;
  }
  .card:hover{border-color:var(--clay-bright);}
  .card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--clay-bright);margin-bottom:12px;}
  .card-body{font-size:15px;line-height:1.55;color:#eef0ea;white-space:pre-wrap;word-break:break-word;}
  .card-hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--steel);text-align:center;margin-top:18px;}

  .verdict-row{display:flex;gap:10px;margin-bottom:12px;}
  button.act{
    flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;
    border:1.5px solid var(--steel);background:transparent;color:var(--chalk);padding:12px 14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  button.act.nope{border-color:var(--bad);color:var(--bad-bright);}
  button.act.nope:hover{background:var(--bad);color:var(--chalk);}
  button.act.yep{border-color:var(--ok);color:var(--ok-bright);}
  button.act.yep:hover{background:var(--ok);color:var(--iron);}

  .nav-row{display:flex;justify-content:center;gap:10px;}
  button.icon{
    border:1.5px solid var(--steel);background:transparent;color:var(--chalk);
    width:40px;height:40px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
  }
  button.icon:hover{border-color:var(--clay-bright);color:var(--clay-bright);}

  .footer-note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--steel);line-height:1.6;font-family:'JetBrains Mono',monospace;text-align:center;}

</head>

const categories = ["Alle", ...Array.from(new Set(CARDS.map(c => c.cat)))];
let activeCat = "Alle";
let order = CARDS.map((_, i) => i);
let idx = 0;
let flipped = false;
let known = {};

function shuffleArr(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filteredOrder(){
  if(activeCat === "Alle") return order;
  return order.filter(i => CARDS[i].cat === activeCat);
}

function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = '';
  categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (c === activeCat ? ' active' : '');
    b.textContent = c;
    b.addEventListener('click', () => {
      activeCat = c;
      idx = 0;
      flipped = false;
      renderCats();
      renderCard();
    });
    el.appendChild(b);
  });
}

function renderCard(){
  const fo = filteredOrder();
  if(idx >= fo.length) idx = 0;
  const cardIndex = fo[idx];
  const card = CARDS[cardIndex];

  document.getElementById('progress').textContent = fo.length ? `Karte ${idx + 1} / ${fo.length}` : 'Keine Karten';
  const knownVals = Object.values(known);
  document.getElementById('knownCount').textContent = knownVals.filter(v => v === true).length;
  document.getElementById('unknownCount').textContent = knownVals.filter(v => v === false).length;

  if(!card){
    document.getElementById('cardEyebrow').textContent = '';
    document.getElementById('cardBody').textContent = 'Keine Karten in dieser Kategorie.';
    return;
  }
  document.getElementById('cardEyebrow').textContent = card.cat + (flipped ? ' · Antwort' : ' · Frage');
  document.getElementById('cardBody').textContent = flipped ? card.a : card.q;
}

document.getElementById('card').addEventListener('click', () => {
  flipped = !flipped;
  renderCard();
});

function next(){
  flipped = false;
  const fo = filteredOrder();
  idx = (idx + 1) % fo.length;
  renderCard();
}
function prev(){
  flipped = false;
  const fo = filteredOrder();
  idx = (idx - 1 + fo.length) % fo.length;
  renderCard();
}
function markKnown(val){
  const fo = filteredOrder();
  const cardIndex = fo[idx];
  known[cardIndex] = val;
  next();
}

document.getElementById('btnNope').addEventListener('click', () => markKnown(false));
document.getElementById('btnYep').addEventListener('click', () => markKnown(true));
document.getElementById('btnPrev').addEventListener('click', prev);
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnShuffle').addEventListener('click', () => {
  order = shuffleArr(CARDS.map((_, i) => i));
  idx = 0;
  flipped = false;
  renderCard();
});
document.getElementById('btnReset').addEventListener('click', () => {
  order = CARDS.map((_, i) => i);
  activeCat = "Alle";
  idx = 0;
  flipped = false;
  known = {};
  renderCats();
  renderCard();
});

renderCats();
renderCard();
</script>

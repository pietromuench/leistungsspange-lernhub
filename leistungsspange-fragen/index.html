<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragenbeantwortung — Karteikarten</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <h1>Fragenbeantwortung — Karteikarten</h1>
    <div class="context">Leistungsspange OSL 1 &nbsp;·&nbsp; Abnahme 10.10.2026</div>
  </header>

  <div class="cat-strip" id="cats"></div>

  <div class="card-meta">
    <span id="cardProgress"></span>
    <span>✓ <b id="knownCount">0</b> &nbsp; ✗ <b id="unknownCount">0</b></span>
  </div>

  <div class="flashcard" id="flashcard">
    <div class="card-label" id="cardLabel"></div>
    <div class="card-text" id="cardText"></div>
    <div class="card-flip-hint">Tippen zum Umdrehen</div>
  </div>

  <div class="verdict-row">
    <button class="btn nope" style="flex:1" id="btnNope">✗ Nochmal</button>
    <button class="btn yep" style="flex:1" id="btnYep">✓ Kann ich</button>
  </div>

  <div class="nav-row">
    <button class="btn" id="btnPrev">‹</button>
    <button class="btn" id="btnShuffle">Mischen</button>
    <button class="btn" id="btnReset">Zurücksetzen</button>
    <button class="btn" id="btnNextCard">›</button>
  </div>

  <div class="footer">
    Leistungsspange OSL 1 &nbsp;·&nbsp; Abnahme 10.10.2026 &nbsp;·&nbsp; Sporthalle Schipkau
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
